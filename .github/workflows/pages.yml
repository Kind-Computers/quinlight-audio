name: Deploy audio samples to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and extract 96 kHz AAC bundle under 96khz/
        run: |
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/download/audio-bundle-v1/quinlight-audio-96khz-bundle.zip" \
            -o /tmp/bundle.zip
          unzip -q /tmp/bundle.zip -d /tmp/bundle-extract
          mv /tmp/bundle-extract/quinlight-audio-96khz _site/96khz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
